<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home Assistant preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f17; color: #e9eefb;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between;
    padding: 22px 34px; border-bottom: 1px solid rgba(255,255,255,.07); }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  .badge { font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    color: #9fb4ff; background: rgba(91,129,255,.12); padding: 6px 10px; border-radius: 8px; }
  main { padding: 26px 34px; display: grid; gap: 16px;
    grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .card { border-radius: 20px; padding: 20px; min-height: 130px;
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03));
    border: 1px solid rgba(255,255,255,.08); }
  .card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(255,255,255,.5); font-weight: 600; }
  .big { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .sub { margin-top: 6px; font-size: 13px; color: rgba(255,255,255,.45); }
  .wide { grid-column: span 3; min-height: 120px; }
  .row { display: flex; align-items: center; justify-content: space-between;
    gap: 20px; padding: 12px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .row:first-of-type { border-top: 0; }
  .sw { width: 44px; height: 25px; border-radius: 20px; background: #4ade80; position: relative; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 21px; width: 19px; height: 19px;
    border-radius: 50%; background: #f4fff8; }
  .muted { color: rgba(255,255,255,.4); }
</style>
</head>
<body>
  <header>
    <h1>Home Assistant <span class="muted">· Energy</span></h1>
    <span class="badge">Local preview</span>
  </header>
  <main>
    <section class="card wide">
      <h2>Now</h2>
      <div class="big">3.2 kW</div>
      <div class="sub">Solar 2.1 kW · Battery 68% · Grid 1.1 kW</div>
    </section>
    <section class="card"><h2>Living room</h2><div class="big">21.5°</div><div class="sub">Heating · 40%</div></section>
    <section class="card"><h2>Lights</h2><div class="big">4 on</div><div class="sub">Lamp · Kitchen · Hall · Porch</div></section>
    <section class="card"><h2>Motion</h2><div class="big">Clear</div><div class="sub">Hall sensor · 12 min ago</div></section>
    <section class="card wide">
      <h2>Switches</h2>
      <div class="row"><span>Lamp</span><span class="sw"></span></div>
      <div class="row"><span>Hallway motion automation</span><span class="sw"></span></div>
    </section>
  </main>
</body>
</html>
