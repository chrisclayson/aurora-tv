name: Aurora TV Configuration
version: "1.4.1"
slug: aurora_config
description: Central Aurora TV configuration and UK Freeview XMLTV guide
url: https://github.com/chrisclayson/aurora-tv
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8090
panel_icon: mdi:television-guide
panel_title: Aurora TV
webui: "http://[HOST]:[PORT:8090]/"
# Share the Home Assistant host network so the add-on can reach TVs on other
# VLANs/subnets and publish 8090 directly on the HA host.
host_network: true
options:
  config_token: ""
  public_url: ""
  epg_region: uk
  epg_source_url: "https://raw.githubusercontent.com/dp247/Freeview-EPG/master/epg.xml"
  epg_lcn_url: "https://en.wikipedia.org/w/api.php?action=parse&page=List_of_DTT_channels_in_the_United_Kingdom&prop=wikitext&format=json&origin=*"
  epg_refresh_minutes: 60
schema:
  config_token: str
  public_url: str
  epg_region: list(uk|uk-london|uk-scotland|uk-wales|uk-northern-ireland)
  epg_source_url: url
  epg_lcn_url: url
  epg_refresh_minutes: int(1,1440)
watchdog: "http://[HOST]:[PORT:8090]/api/health"
